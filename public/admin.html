<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Node.js CMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { cyber: ['"Fira Code", "Courier New", monospace'] },
                    colors: {
                        neon: {
                            cyan: '#06b6d4',
                            purple: '#7c3aed',
                            pink: '#ec4899'
                        }
                    }
                }
            }
        };
    </script>
    <style>
        body { background: #050508; background-image: radial-gradient(circle at 10% 10%, rgba(236,72,153,0.08), transparent 35%), radial-gradient(circle at 90% 20%, rgba(6,182,212,0.08), transparent 40%), radial-gradient(circle at 50% 90%, rgba(124,58,237,0.08), transparent 50%); }
        ::selection { background: #ec4899; color: #050508; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #050508; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #7c3aed, #ec4899); }
    </style>
</head>
<body class="min-h-screen bg-[#050508] font-mono tracking-wider text-gray-200 antialiased overflow-x-hidden">

    <div class="relative px-6 max-w-5xl mx-auto pt-12 pb-16">

        <!-- Top bar -->
        <div class="flex items-center justify-between mb-12">
            <div>
                <div class="text-[10px] text-cyan-400/60 tracking-[0.3em] mb-1">// AREA ADMIN //</div>
                <h1 class="text-4xl font-bold tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-pink-400 via-purple-400 to-cyan-400">ADMIN TERMINAL</h1>
                <p class="text-xs text-purple-300/70 mt-2 tracking-widest">// kelola &amp; atur publikasi postingan</p>
            </div>
            <a href="/" class="group inline-flex items-center gap-2 bg-gradient-to-r from-cyan-900/80 to-purple-900/80 border border-cyan-400/30 px-5 py-2 text-cyan-100 text-sm tracking-widest font-semibold rounded-lg transition hover:shadow-[0_0_20px_5px_rgba(6,182,212,0.3)]">
                <span class="text-cyan-300">&gt;</span> VIEWER
            </a>
        </div>

        <!-- Login -->
        <div id="loginBox" class="relative">
            <div class="absolute -inset-1 bg-gradient-to-r from-cyan-500 via-pink-500 to-purple-600 rounded-xl blur opacity-30"></div>
            <div class="relative bg-[#0a0a0f] border border-cyan-500/40 rounded-xl shadow-[0_0_35px_3px_rgba(6,182,212,0.15)] p-8">
                <h2 class="text-xl font-bold text-pink-200 border-l-4 border-pink-500 pl-4 tracking-wide mb-5">LOGIN</h2>
                <div class="space-y-4">
                    <div>
                        <label class="text-[11px] text-cyan-400/70 uppercase tracking-wider mb-2 block">Username</label>
                        <input type="text" id="loginUser" class="bg-[#050508] border border-cyan-900/60 rounded-lg px-4 py-3 text-cyan-100 text-sm placeholder:text-cyan-900 focus:outline-none focus:border-pink-500 focus:ring-1 focus:ring-pink-500/40 w-full">
                    </div>
                    <div>
                        <label class="text-[11px] text-cyan-400/70 uppercase tracking-wider mb-2 block">Password</label>
                        <input type="password" id="loginPass" class="bg-[#050508] border border-cyan-900/60 rounded-lg px-4 py-3 text-cyan-100 text-sm placeholder:text-cyan-900 focus:outline-none focus:border-pink-500 focus:ring-1 focus:ring-pink-500/40 w-full">
                    </div>
                    <div class="pt-1">
                        <button id="loginBtn" class="w-full bg-gradient-to-r from-pink-600 to-purple-600 hover:from-pink-500 hover:to-purple-500 text-white text-sm tracking-widest font-bold rounded-lg py-3 transition shadow-[0_0_18px_2px_rgba(236,72,153,0.4)]">MASUK &gt;</button>
                    </div>
                    <p id="loginMsg" class="text-xs text-pink-300 hidden"></p>
                </div>
            </div>
        </div>

        <!-- Admin panel -->
        <div id="adminPanel" class="hidden">
            <!-- Form -->
            <div class="relative mb-12">
                <div class="absolute -inset-1 bg-gradient-to-r from-cyan-500 via-purple-500 to-pink-500 rounded-xl blur opacity-25"></div>
                <div class="relative bg-[#0a0a0f] border border-purple-500/40 rounded-xl shadow-[0_0_30px_2px_rgba(124,58,237,0.15)] p-8">
                    <div class="flex items-center justify-between mb-6">
                        <h2 class="text-xl font-bold text-cyan-100 border-l-4 border-cyan-400 pl-4 tracking-wide">Tambah Postingan Baru</h2>
                        <div class="text-[10px] text-purple-300/60">&gt; CREATE <span class="text-cyan-400 animate-pulse">*</span></div>
                    </div>
                    <form id="postForm" class="space-y-5">
                        <div>
                            <label class="text-[11px] text-cyan-400/70 uppercase tracking-wider mb-2 block">Judul</label>
                            <input type="text" id="title" required class="bg-[#050508] border border-cyan-900/60 rounded-lg px-4 py-3 text-cyan-100 text-sm placeholder:text-cyan-900 focus:outline-none focus:border-pink-500 focus:ring-1 focus:ring-pink-500/40 w-full">
                        </div>
                        <div>
                            <label class="text-[11px] text-cyan-400/70 uppercase tracking-wider mb-2 block">Konten</label>
                            <textarea id="content" rows="4" required class="bg-[#050508] border border-cyan-900/60 rounded-lg px-4 py-3 text-cyan-100 text-sm placeholder:text-cyan-900 focus:outline-none focus:border-pink-500 focus:ring-1 focus:ring-pink-500/40 w-full"></textarea>
                        </div>
                        <button type="submit" class="bg-gradient-to-r from-cyan-600 to-purple-600 hover:from-cyan-500 hover:to-purple-500 text-white text-sm tracking-widest font-bold rounded-lg px-6 py-3 transition shadow-[0_0_18px_2px_rgba(6,182,212,0.4)] border border-cyan-400/30">SIMPAN &amp; PUBLISH &gt;</button>
                    </form>
                </div>
            </div>

            <!-- Daftar semua postingan -->
            <div class="relative">
                <div class="absolute -inset-1 bg-gradient-to-r from-pink-500 via-purple-500 to-cyan-500 rounded-xl blur opacity-20"></div>
                <div class="relative bg-[#0a0a0f] border border-pink-500/40 rounded-xl shadow-[0_0_30px_2px_rgba(236,72,153,0.12)] p-8">
                    <div class="flex items-center justify-between mb-6">
                        <h2 class="text-xl font-bold text-pink-200 border-l-4 border-pink-500 pl-4 tracking-wide">Semua Postingan</h2>
                        <div class="text-[10px] text-purple-300/60">&gt; MANAGE</div>
                    </div>
                    <div id="postsList" class="space-y-4">
                        <p class="text-cyan-200 text-sm animate-pulse">MEMUAT DATA...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Kredensial admin disimpan sementara di sessionStorage (HTTP Basic)
        let cred = sessionStorage.getItem('adminCred') || null;

        const loginBox = document.getElementById('loginBox');
        const adminPanel = document.getElementById('adminPanel');
        const loginMsg = document.getElementById('loginMsg');

        function authHeaders() {
            return cred ? { 'Authorization': 'Basic ' + cred } : {};
        }

        function showLogin(message) {
            cred = null;
            sessionStorage.removeItem('adminCred');
            loginBox.classList.remove('hidden');
            adminPanel.classList.add('hidden');
            if (message) {
                loginMsg.textContent = message;
                loginMsg.classList.remove('hidden');
            }
        }

        function showPanel() {
            loginBox.classList.add('hidden');
            adminPanel.classList.remove('hidden');
            loginMsg.classList.add('hidden');
            fetchPosts();
        }

        document.getElementById('loginBtn').addEventListener('click', () => {
            const user = document.getElementById('loginUser').value;
            const pass = document.getElementById('loginPass').value;
            if (!user || !pass) {
                loginMsg.textContent = 'Username dan password wajib diisi.';
                loginMsg.classList.remove('hidden');
                return;
            }
            cred = btoa(user + ':' + pass);
            // Tes kredensial dengan memuat daftar admin
            fetch('/api/admin/posts', { headers: authHeaders() }).then(r => {
                if (r.status === 401) {
                    showLogin('Username atau password salah.');
                } else if (r.status === 503) {
                    r.json().then(j => showLogin(j.error || 'Area admin belum aktif. Set ADMIN_USER dan ADMIN_PASSWORD.'));
                } else {
                    sessionStorage.setItem('adminCred', cred);
                    showPanel();
                }
            }).catch(() => showLogin('Gagal terhubung ke server.'));
        });

        function escapeHtml(text) {
            return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        async function fetchPosts() {
            const container = document.getElementById('postsList');
            try {
                const response = await fetch('/api/admin/posts', { headers: authHeaders() });
                if (response.status === 401) { showLogin('Sesi berakhir. Silakan masuk ulang.'); return; }
                const data = await response.json();
                if (!Array.isArray(data)) throw new Error(data.error || ('HTTP ' + response.status));

                if (data.length === 0) {
                    container.innerHTML = '<p class="text-cyan-200 text-sm">BELUM ADA POSTINGAN.</p>';
                    return;
                }

                container.innerHTML = data.map(post => `
                    <div class="relative group bg-[#050508] border border-cyan-900/40 rounded-lg p-5 transition-shadow hover:shadow-[0_0_16px_2px_rgba(236,72,153,0.15)]">
                        <div class="flex items-center justify-between mb-2">
                            <h3 class="text-base font-bold text-cyan-100 tracking-wide">${escapeHtml(post.title)}</h3>
                            <span class="text-[10px] px-2 py-1 rounded border ${post.published === true ? 'border-cyan-400/40 text-cyan-300 bg-cyan-400/10' : 'border-yellow-500/40 text-yellow-300 bg-yellow-500/10'}">
                                ${post.published === true ? 'ONLINE' : 'DRAFT'}
                            </span>
                        </div>
                        <p class="text-sm text-gray-300 leading-relaxed mb-3">${escapeHtml(post.content)}</p>
                        <div class="flex items-center justify-between">
                            <span class="text-[11px] text-cyan-400/60">Dibuat: ${new Date(post.createdAt).toLocaleString()}</span>
                            <button data-id="${post.id}" data-next="${post.published === true ? 'false' : 'true'}"
                                class="toggleBtn text-xs px-4 py-2 rounded font-bold tracking-widest transition ${post.published === true ? 'bg-yellow-600/80 hover:bg-yellow-500 text-white' : 'bg-gradient-to-r from-cyan-600 to-purple-600 hover:from-cyan-500 hover:to-purple-500 text-white shadow-[0_0_12px_2px_rgba(6,182,212,0.35)]'}">
                                ${post.published === true ? 'UNPUBLISH' : 'PUBLISH &gt;'}
                            </button>
                        </div>
                    </div>
                `).join('');

                container.querySelectorAll('.toggleBtn').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        btn.disabled = true;
                        try {
                            const res = await fetch('/api/posts/' + btn.dataset.id, {
                                method: 'PATCH',
                                headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders()),
                                body: JSON.stringify({ published: btn.dataset.next === 'true' })
                            });
                            if (res.status === 401) { showLogin('Sesi berakhir. Silakan masuk ulang.'); return; }
                            if (!res.ok) {
                                let msg = 'HTTP ' + res.status;
                                try { const j = await res.json(); if (j.error) msg = j.error; } catch (_) {}
                                alert('Gagal mengubah status: ' + msg);
                            }
                            fetchPosts();
                        } finally {
                            btn.disabled = false;
                        }
                    });
                });
            } catch (error) {
                console.error('Gagal memuat daftar:', error);
                container.innerHTML = `<p class="text-red-400 text-sm">!!! ERROR: ${escapeHtml(String(error.message || error))}</p>`;
            }
        }

        document.getElementById('postForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('title').value;
            const content = document.getElementById('content').value;

            const response = await fetch('/api/posts', {
                method: 'POST',
                headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders()),
                body: JSON.stringify({ title, content })
            });

            if (response.ok) {
                document.getElementById('postForm').reset();
                fetchPosts();
            } else if (response.status === 401) {
                showLogin('Sesi berakhir. Silakan masuk ulang.');
            } else if (response.status === 503) {
                const j = await response.json().catch(() => ({}));
                showLogin(j.error || 'Area admin belum aktif: set ADMIN_USER dan ADMIN_PASSWORD di environment variables.');
            } else {
                let msg = 'HTTP ' + response.status;
                try { const j = await response.json(); if (j.error) msg = j.error; } catch (_) {}
                alert('Gagal menyimpan postingan: ' + msg);
            }
        });

        // Masuk otomatis bila kredensial masih tersimpan di session ini
        if (cred) {
            fetch('/api/admin/posts', { headers: authHeaders() }).then(r => {
                if (r.ok) showPanel();
                else showLogin(null);
            });
        }
    </script>
</body>
</html>
