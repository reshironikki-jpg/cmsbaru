<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faruq CMS — Daftar Postingan</title>
    <!-- Tailwind CSS untuk styling cepat -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { cyber: ['"Fira Code", "Courier New", monospace'] },
                    colors: {
                        neon: {
                            cyan: '#06b6d4',
                            purple: '#7c3aed',
                            pink: '#ec4899',
                        }
                    }
                }
            }
        };
    </script>
    <style>
        body { background: #050508; background-image: radial-gradient(circle at 20% 10%, rgba(6,182,212,0.08), transparent 40%), radial-gradient(circle at 90% 90%, rgba(124,58,237,0.08), transparent 45%); }
        ::selection { background: #7c3aed; color: #050508; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #050508; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #06b6d4, #7c3aed); }
    </style>
</head>
<body class="min-h-screen bg-[#050508] font-mono tracking-wider text-gray-200 antialiased">

    <div class="relative px-6 max-w-5xl mx-auto py-10">

        <!-- Hero section -->
        <div class="text-center mb-12">
            <div class="text-[10px] text-cyan-400/60 tracking-[0.3em] mb-2">// CONTENT MANAGEMENT //</div>
            <!-- Foto pemilik (syamil.jpeg) -->
            <div class="inline-block relative mb-4">
                <div class="absolute -inset-1 bg-gradient-to-br from-cyan-400 via-purple-500 to-pink-500 rounded-full blur opacity-70"></div>
                <img src="/syamil.jpeg" alt="Syamil — pemilik Faruq CMS" class="relative w-32 h-32 sm:w-40 sm:h-40 rounded-full object-cover border-2 border-cyan-300/60 shadow-[0_0_25px_5px_rgba(6,182,212,0.4)]">
                <span class="absolute -bottom-2 right-0 bg-gradient-to-r from-cyan-600 to-purple-600 text-[10px] text-white px-2 py-0.5 rounded-full border border-cyan-300/50 tracking-widest">SYAMIL</span>
            </div>
            <h1 class="text-4xl sm:text-5xl font-bold tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-purple-400 to-pink-500">&gt; FARUQ_CMS</h1>
            <p class="text-lg sm:text-xl text-transparent bg-clip-text bg-gradient-to-r from-pink-300 to-purple-300 mt-4 font-bold">"Membaca dan Menulis adalah Nutrisi Otak"</p>
            <p class="text-xs text-cyan-200/70 mt-2 tracking-widest">// daftar postingan terpublikasi</p>

            <!-- Gambar pelengkap hero (Unsplash — gratis & open source) -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mt-10">
                <div class="relative group rounded-xl overflow-hidden border border-cyan-500/40 shadow-[0_0_20px_3px_rgba(6,182,212,0.25)] transition-shadow hover:shadow-[0_0_28px_5px_rgba(6,182,212,0.4)]">
                    <img src="https://images.unsplash.com/photo-1457369804613-52c61a468e7d?auto=format&fit=crop&w=800&q=70" alt="Perpustakaan" loading="lazy" class="w-full h-44 object-cover opacity-90 group-hover:opacity-100 transition">
                    <span class="absolute top-2 left-2 text-[10px] bg-black/60 text-cyan-300 px-2 py-1 rounded border border-cyan-400/30">#membaca</span>
                </div>
                <div class="relative group rounded-xl overflow-hidden border border-purple-500/40 shadow-[0_0_20px_3px_rgba(124,58,237,0.25)] transition-shadow hover:shadow-[0_0_28px_5px_rgba(124,58,237,0.4)] sm:mt-6">
                    <img src="https://images.unsplash.com/photo-1455390582262-044cdead277a?auto=format&fit=crop&w=800&q=70" alt="Menulis dengan pena" loading="lazy" class="w-full h-44 object-cover opacity-90 group-hover:opacity-100 transition">
                    <span class="absolute top-2 left-2 text-[10px] bg-black/60 text-purple-300 px-2 py-1 rounded border border-purple-400/30">#menulis</span>
                </div>
                <div class="relative group rounded-xl overflow-hidden border border-pink-500/40 shadow-[0_0_20px_3px_rgba(236,72,153,0.25)] transition-shadow hover:shadow-[0_0_28px_5px_rgba(236,72,153,0.4)]">
                    <img src="https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&w=800&q=70" alt="Buku-buku" loading="lazy" class="w-full h-44 object-cover opacity-90 group-hover:opacity-100 transition">
                    <span class="absolute top-2 left-2 text-[10px] bg-black/60 text-pink-300 px-2 py-1 rounded border border-pink-400/30">#nutrisi_otak</span>
                </div>
            </div>
        </div>

        <!-- Daftar Konten Publik -->
        <div class="relative bg-black/70 backdrop-blur-sm border border-cyan-500/30 rounded-xl shadow-[0_0_25px_5px_rgba(6,182,212,0.2)] p-8">
            <div class="absolute -top-3 left-6 w-12 h-1.5 bg-gradient-to-r from-cyan-400 to-purple-500 rounded-full"></div>
            <div class="absolute -bottom-3 right-6 w-16 h-1.5 bg-gradient-to-l from-purple-500 to-cyan-400 rounded-full"></div>

            <h2 class="text-xl font-bold mb-4 text-purple-100 border-l-4 border-cyan-400 pl-4">Daftar Postingan</h2>
            <div id="postsList" class="space-y-4">
                <p class="text-cyan-200 text-sm animate-pulse">MEMUAT DATA...</p>
            </div>
        </div>

        <div class="mt-8 flex justify-center">
            <a href="/admin.html" class="group inline-flex items-center gap-2 bg-gradient-to-r from-cyan-900 to-purple-900 border border-cyan-400/40 px-6 py-3 text-cyan-100 text-sm tracking-widest font-semibold rounded-lg transition hover:shadow-[0_0_20px_5px_rgba(6,182,212,0.35)] hover:border-cyan-300">
                <span class="text-cyan-300">&gt;</span> MASUK ADMIN
            </a>
        </div>
    </div>

    <script>
        // Fungsi untuk mengambil dan merender postingan
        async function fetchPosts() {
            const container = document.getElementById('postsList');
            try {
                const response = await fetch('/api/posts');
                const data = await response.json();

                // API bisa mengembalikan { error: ... } saat gagal (bukan array)
                if (!Array.isArray(data)) {
                    throw new Error(data.error || `HTTP ${response.status}`);
                }
                if (data.length === 0) {
                    container.innerHTML = '<p class="text-cyan-200 text-sm">BELUM ADA POSTINGAN TERPUBLIKASI</p>';
                    return;
                }

                container.innerHTML = data.map(post => `
                    <div class="relative group overflow-hidden bg-[#0a0a0f] border border-cyan-900/40 rounded-lg p-5 shadow-[0_0_12px_1px_rgba(6,182,212,0.08)] transition-shadow hover:shadow-[0_0_20px_2px_rgba(6,182,212,0.2)]">
                        <div class="absolute top-0 left-0 w-full h-px bg-gradient-to-r from-transparent via-cyan-400/70 to-transparent"></div>
                        <h3 class="text-base font-bold text-cyan-100 mb-2 tracking-wide">${escapeHtml(post.title)}</h3>
                        <p class="text-sm text-gray-300 leading-relaxed mb-3">${escapeHtml(post.content)}</p>
                        <div class="flex items-center justify-between text-[11px] text-cyan-400/70 font-mono">
                            <span>Dibuat: ${new Date(post.createdAt).toLocaleString()}</span>
                            <span class="opacity-0 group-hover:opacity-100 transition">&gt; READ</span>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Gagal memuat post:', error);
                container.innerHTML = `<p class="text-red-400 text-sm font-mono">!!! ERROR: ${escapeHtml(String(error.message || error))}</p>`;
            }
        }

        // Helper untuk mencegah XSS dasar
        function escapeHtml(text) {
            return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // Load data saat halaman dibuka
        fetchPosts();
    </script>
</body>
</html>
