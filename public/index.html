<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Node.js CMS Dashboard</title>
    <!-- Tailwind CSS untuk styling cepat -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { cyber: ['"Fira Code", "Courier New", monospace'] },
                    colors: {
                        neon: {
                            cyan: '#06b6d4',
                            purple: '#7c3aed',
                            pink: '#ec4899',
                        }
                    }
                }
            }
        };
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body { background: #050508; background-image: radial-gradient(circle at 20% 10%, rgba(6,182,212,0.08), transparent 40%), radial-gradient(circle at 90% 90%, rgba(124,58,237,0.08), transparent 45%); }
        ::selection { background: #7c3aed; color: #050508; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #050508; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #06b6d4, #7c3aed); }
    </style>
</head>
<body class="min-h-screen bg-[#050508] font-mono tracking-wider text-gray-200 antialiased">

    <div class="relative px-6 max-w-5xl mx-auto">
        <div class="text-center mb-10">
            <h1 class="text-4xl font-bold tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-600">> NODE_CMS::FIREBASE</h1>
            <p class="text-sm text-cyan-200 mt-2 tracking-widest">// daftar postingan terpublikasi</p>
        </div>

        <div class="relative bg-opacity-70 bg-black backdrop-blur-sm border border-cyan-500/30 rounded-xl shadow-[0_0_25px_5px_rgba(6,182,212,0.2)] p-8">
            <div class="absolute -top-3 left-6 w-12 h-1.5 bg-gradient-to-r from-cyan-400 to-purple-500 rounded-full"></div>
            <div class="absolute -bottom-3 right-6 w-16 h-1.5 bg-gradient-to-l from-purple-500 to-cyan-400 rounded-full"></div>

            <h2 class="text-xl font-bold mb-4 text-purple-100 border-l-4 border-cyan-400 pl-4">Daftar Postingan</h2>
            <div id="postsList" class="space-y-4">
                <p class="text-cyan-200 text-sm">MEMUAT DATA... _<span class="animate-pulse"></span></p>
            </div>
        </div>

        <div class="mt-8 flex justify-center">
            <a href="/admin.html" class="group inline-flex items-center gap-2 bg-gradient-to-r from-cyan-900 to-purple-900 border border-cyan-400/40 px-6 py-3 text-cyan-100 text-sm tracking-widest font-semibold rounded-lg transition hover:shadow-[0_0_20px_5px_rgba(6,182,212,0.35)] hover:border-cyan-300">
                <span class="text-cyan-300">></span> MASUK ADMIN
            </a>
        </div>
    </div>

    <script>
        // Fungsi untuk mengambil dan merender postingan
        async function fetchPosts() {
            const container = document.getElementById('postsList');
            try {
                const response = await fetch('/api/posts');
                const data = await response.json();

                // API bisa mengembalikan { error: ... } saat gagal (bukan array)
                if (!Array.isArray(data)) {
                    throw new Error(data.error || `HTTP ${response.status}`);
                }
                if (data.length === 0) {
                    container.innerHTML = '<p class="text-cyan-200 text-sm">BELUM ADA POSTINGAN TERPUBLIKASI</p>';
                    return;
                }

                container.innerHTML = data.map(post => `
                    <div class="relative group overflow-hidden bg-[#0a0a0f] border border-cyan-900/40 rounded-lg p-5 shadow-[0_0_12px_1px_rgba(6,182,212,0.08)] transition-shadow hover:shadow-[0_0_20px_2px_rgba(6,182,212,0.2)]">
                        <div class="absolute top-0 left-0 w-full h-px bg-gradient-to-r from-transparent via-cyan-400/70 to-transparent"></div>
                        <h3 class="text-base font-bold text-cyan-100 mb-2 tracking-wide">${escapeHtml(post.title)}</h3>
                        <p class="text-sm text-gray-300 leading-relaxed mb-3">${escapeHtml(post.content)}</p>
                        <div class="flex items-center justify-between text-[11px] text-cyan-400/70 font-mono">
                            <span>Dibuat: ${new Date(post.createdAt).toLocaleString()}</span>
                            <span class="opacity-0 group-hover:opacity-100 transition">> READ</span>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Gagal memuat post:', error);
                    container.innerHTML = `<p class="text-red-400 text-sm font-mono">!!! ERROR: ${escapeHtml(String(error.message || error))}</p>`;
            }
        }

        // Helper untuk mencegah XSS dasar
        function escapeHtml(text) {                return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // Load data saat halaman dibuka
        fetchPosts();
    </script>
</body>
</html>
