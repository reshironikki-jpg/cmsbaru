<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Node.js CMS Dashboard</title>
    <!-- Tailwind CSS untuk styling cepat -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">

    <div class="container mx-auto p-6 max-w-4xl">
        <header class="mb-8 flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold text-gray-800">Node.js CMS & Firestore</h1>
                <p class="text-gray-600">Daftar postingan terpublikasi</p>
            </div>
            <a href="/admin.html" class="text-sm bg-gray-800 text-white px-3 py-2 rounded-lg hover:bg-gray-700 transition">Masuk Admin</a>
        </header>

        <!-- Daftar Konten Publik -->
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-semibold mb-4 text-gray-700">Daftar Postingan</h2>
            <div id="postsList" class="space-y-4">
                <p class="text-gray-500">Memuat data...</p>
            </div>
        </div>
    </div>

    <script>
        // Fungsi untuk mengambil dan merender postingan
        async function fetchPosts() {
            const container = document.getElementById('postsList');
            try {
                const response = await fetch('/api/posts');
                const data = await response.json();

                // API bisa mengembalikan { error: ... } saat gagal (bukan array)
                if (!Array.isArray(data)) {
                    throw new Error(data.error || `HTTP ${response.status}`);
                }
                if (data.length === 0) {
                    container.innerHTML = '<p class="text-gray-500">Belum ada postingan.</p>';
                    return;
                }

                container.innerHTML = data.map(post => `
                    <div class="border-b pb-4 mb-4">
                        <h3 class="text-lg font-bold text-gray-800">${escapeHtml(post.title)}</h3>
                        <p class="text-gray-600 mt-1">${escapeHtml(post.content)}</p>
                        <span class="text-xs text-gray-400 mt-2 block">Dibuat: ${new Date(post.createdAt).toLocaleString()}</span>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Gagal memuat post:', error);
                container.innerHTML = `<p class="text-red-600">Gagal memuat data: ${escapeHtml(String(error.message || error))}</p>`;
            }
        }

        // Helper untuk mencegah XSS dasar
        function escapeHtml(text) {                return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // Load data saat halaman dibuka
        fetchPosts();
    </script>
</body>
</html>
